<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="#e9e9e5" name="theme-color"/>
<title>Reviews | audiocaf</title>
<link href="https://use.typekit.net/zcz5pld.css" rel="stylesheet"/>
<link href="css/reviews.css" rel="stylesheet"/>
<script src="js/config.js" defer blocking="render"></script>
<script src="js/seed.js" defer blocking="render"></script>
<script src="js/reviews.js" defer blocking="render"></script>
</head>
<body>
<div class="page-shell">
<header class="site-header">
<a aria-label="audiocaf home" class="wordmark" href="index.html">audiocaf</a>
<nav class="header-actions">
<a href="index.html">← back to main</a>
<button class="link-btn" id="add-review" type="button">+ add review</button>
</nav>
</header>
<main class="reviews"></main>
<dialog id="review-dialog">
<form id="review-form">
<h2 id="form-title">New review</h2>
                <input type="hidden" name="id">
                <label>Spotify album link (optional)
                    <span class="row"><input name="spotify" type="url" placeholder="https://open.spotify.com/album/..."><button type="button" id="spotify-import" class="link-btn">Import</button></span>
                    <span id="spotify-status" class="status" role="status"></span>
                </label>
<label>Artist <input name="artist" required=""/></label>
<label>Album title <input name="title" required=""/></label>
<label>Score (0 to 10) <input max="10" min="0" name="score" required="" step="0.1" type="number"/></label>
<label>Review <textarea name="text" required="" rows="7"></textarea></label>
<label>Tracklist (one per line) <textarea name="tracks" rows="5"></textarea></label>
<label>Cover image (optional) <input accept="image/*" name="cover" type="file"/></label>
<div class="form-actions">
<button class="link-btn" id="cancel-review" type="button">Cancel</button>
<button class="link-btn primary" type="submit">Save review</button>
</div>
</form>
</dialog>
<footer><a href="index.html">audiocaf</a> <span>·</span> listen closely</footer>
</div>
</body>
</html>
